ekf_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom # Local uses odom as its reference

    odom0: /odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, true, true, false]

ekf_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map # Global uses map as its reference

    odom0: /odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    
    imu0: /imu/data
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, true, true, false]
    
    odom1: /odometry/gps
    odom1_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]

navsat_transform:
  ros__parameters:
    frequency: 30.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: false